services:
  weather-system:
    image: internal-weather-system:1.0.0
    ports:
      - "${HOST_IP:-0.0.0.0}:${HOST_PORT:-8080}:8080"
    env_file: [.env.internal]
    volumes: [weather-data:/data]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp:size=32m,mode=1777]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    user: "10001:10001"
volumes:
  weather-data:
